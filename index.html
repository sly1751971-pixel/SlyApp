<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Gastos</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Ingresos, gastos por tarjeta, cuotas mes a mes y servicios, 100% offline">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2331/2331966.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2331/2331966.png">
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f3f4f6; color: #111; font-size: 16px; }
    header { background: #111827; color: white; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
    header h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
    header img { width: 32px; height: 32px; border-radius: 8px; background: white; padding: 2px; }
    #btnMenu { background: white; color: #111; border: none; font-size: 22px; width: 48px; height: 48px; border-radius: 12px; cursor: pointer; }
    nav { display: none; background: white; padding: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    nav.open { display: block; }
    nav button { width: 100%; text-align: left; background: #f9fafb; border: none; padding: 16px; margin: 4px 0; border-radius: 12px; font-size: 17px; cursor: pointer; }
    nav button:hover { background: #eef2ff; }
    main { max-width: 720px; margin: 0 auto; padding: 16px; padding-bottom: 110px; }
    .card { background: white; padding: 18px; border-radius: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .card h2 { margin-top: 0; font-size: 19px; }
    label { font-weight: 600; font-size: 14px; display: block; margin-top: 6px; }
    input, select { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid #d1d5db; font-size: 16px; background: white; }
    input:focus, select:focus { outline: 2px solid #4f46e5; border-color: transparent; }
    .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 17px; font-weight: 700; cursor: pointer; margin: 6px 0; }
    .btn-primary { background: #111827; color: white; }
    .btn-green { background: #047857; color: white; }
    .btn-excel { background: #217346; color: white; }
    .btn-outline { background: white; color: #111827; border: 2px solid #111827; }
    .item { padding: 14px 0; border-bottom: 1px solid #eee; }
    .item:last-child { border-bottom: none; }
    .mes { background: #eef2ff; padding: 12px; border-radius: 10px; margin: 6px 0; display: flex; justify-content: space-between; }
    .sugerencia { background: #fffbeb; padding: 12px; border-radius: 10px; margin: 8px 0; font-size: 15px; line-height: 1.4; }
    .seccion { display: none; }
    .seccion.activa { display: block; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; border-top: 1px solid #ddd; padding: 6px; z-index: 10; }
    .bottom-nav button { flex: 1; background: none; border: none; padding: 10px 1px; font-size: 10px; cursor: pointer; color: #666; }
    .bottom-nav button.activo { color: #4f46e5; font-weight: bold; }
    .tarjeta-card { border-radius: 16px; padding: 16px; margin-bottom: 14px; color: white; }
    .tarjeta-visa { background: linear-gradient(135deg, #1a1f71, #2a3bb5); }
    .tarjeta-amex { background: linear-gradient(135deg, #2e77bc, #5aa9e6); }
    .tarjeta-master { background: linear-gradient(135deg, #eb001b, #f79e1b); }
    .tarjeta-otra { background: linear-gradient(135deg, #111827, #4b5563); }
    .tarjeta-efectivo { background: #ecfdf5; color: #111; border: 2px solid #047857; }
    details summary { list-style: none; cursor: pointer; }
    details summary::-webkit-details-marker { display: none; }
    .chip { display: inline-block; padding: 8px 14px; border-radius: 99px; background: #eef2ff; margin: 4px 4px 4px 0; font-size: 14px; cursor: pointer; }
    .chip.activo { background: #111827; color: white; }
  </style>
</head>
<body>

<header>
  <h1><img src="https://cdn-icons-png.flaticon.com/512/2331/2331966.png" alt="Icono"> Mis Gastos</h1>
  <button id="btnMenu" aria-label="Abrir menú" onclick="toggleMenu()">☰</button>
</header>

<nav id="menu" aria-label="Menú principal">
  <button onclick="irA('inicio')">🏠 Inicio</button>
  <button onclick="irA('ingresos')">💰 Ingresos</button>
  <button onclick="irA('tarjetas')">💳 Mis Tarjetas</button>
  <button onclick="irA('agregarTarjeta')">➕ Agregar Tarjeta</button>
  <button onclick="irA('servicios')">🧾 Servicios mensuales</button>
  <button onclick="irA('calendario')">📅 Calendario de cuotas</button>
  <button onclick="irA('ia')">🤖 Organizador IA</button>
  <button onclick="irA('lista')">📊 Todos los gastos</button>
  <button onclick="exportarExcel()">⬇ Exportar a Excel</button>
  <button onclick="exportarBackup()">💾 Descargar backup</button>
</nav>

<main>
  <!-- INICIO -->
  <section id="seccion-inicio" class="seccion activa">
    <div class="card">
      <h2>💰 Balance del mes</h2>
      <div id="balanceInicio"></div>
      <button class="btn btn-green" onclick="irA('ingresos')">+ Agregar ingreso</button>
      <button class="btn btn-outline" onclick="irA('tarjetas')">Ver tarjetas →</button>
    </div>
    <div class="card">
      <h2>Agregar gasto con cuotas</h2>
      <label for="descripcion">¿Qué compraste?</
