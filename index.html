<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlyApp - Mis Finanzas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#f1f5f9;padding-bottom:115px;color:#1e293b}
header{background:#0f172a;color:white;padding:18px;text-align:center;position:sticky;top:0;z-index:10}
header h1{font-size:20px} header p{font-size:13px;opacity:.8}
.container{max-width:520px;margin:0 auto;padding:14px}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.titulo{font-size:22px;font-weight:900;text-align:center;padding:10px;border-radius:12px;margin-bottom:12px;letter-spacing:.3px}
.t-inicio{background:#dbeafe;color:#1e40af}.t-sueldo{background:#dcfce7;color:#166534}.t-gastos{background:#ffedd5;color:#9a3412}.t-tarjetas{background:#ede9fe;color:#5b21b6}.t-agregar{background:#fce7f3;color:#9d174d}.t-resumen{background:#dbeafe;color:#1e40af}.t-calendario{background:#cffafe;color:#155e75}
h2{font-size:17px;margin-bottom:10px} h3{font-size:15px;margin:14px 0 8px}
label{font-size:13px;font-weight:600;display:block;margin-top:10px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;margin-top:4px;font-size:15px;background:white}
textarea{min-height:180px}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;margin-top:10px}
.btn-green{background:#16a34a;color:white}.btn-blue{background:#2563eb;color:white}.btn-gray{background:#e2e8f0;color:#334155}.btn-orange{background:#ea580c;color:white}.btn-purple{background:#7c3aed;color:white}.btn-pink{background:#db2777;color:white}
.fila{display:flex;gap:8px}.fila .btn{flex:1}
.total{font-size:28px;font-weight:800}.mutual{font-size:13px;color:#64748b}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9;gap:8px}
.x{color:red;cursor:pointer;font-weight:800;padding:6px 10px;font-size:18px;flex-shrink:0}
.edit{color:#2563eb;cursor:pointer;font-weight:800;padding:6px;font-size:14px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;overflow-x:auto;border-top:2px solid #2563eb;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:999;box-shadow:0 -2px 10px rgba(0,0,0,.1)}
.bottom button{flex:1;min-width:62px;background:none;border:none;padding:8px 2px;font-size:12px;cursor:pointer;color:#64748b;line-height:1.2;white-space:nowrap}
.bottom button.activo{color:#2563eb;font-weight:800;background:#eff6ff;border-radius:10px}
.mesBox{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.mesBox b.tituloMes{font-size:16px}
.mesBox.abierto{background:white;border:2px solid #2563eb}
.alerta{background:#fef3c7;border:1px solid #fbbf24;padding:12px;border-radius:12px;font-size:14px;line-height:1.5}
.badge{background:#16a34a;color:white;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.badge-rojo{background:#dc2626}
.cuotaRow{display:flex;justify-content:space-between;gap:8px;padding:9px 8px;border-bottom:1px solid #f1f5f9;font-size:13px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex-shrink:0}
.estadoCard{border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer;color:white}
.estadoCard .big{font-size:20px;font-weight:900}
.estadoVisa{background:#2563eb}.estadoAmex{background:#7c3aed}
.saldoBox{display:flex;gap:8px;margin-top:10px}.saldoBox div{flex:1;background:#f8fafc;border-radius:12px;padding:10px;text-align:center}
</style>
</head>
<body>
<header><h1>💳 SlyApp</h1><p>Ingresos • Gastos • Tarjetas • Cuotas</p></header>
<div class="container" id="app"></div>
<nav class="bottom">
<button onclick="mostrar('inicio')" id="b-inicio">🏠<br>Inicio</button>
<button onclick="mostrar('ingresos')" id="b-ingresos">💵<br>Sueldo</button>
<button onclick="mostrar('gastos')" id="b-gastos">🧾<br>Gastos</button>
<button onclick="mostrar('tarjetas')" id="b-tarjetas">🎯<br>Tarjetas</button>
<button onclick="mostrar('agregar')" id="b-agregar">➕<br>Agregar</button>
<button onclick="mostrar('resumen')" id="b-resumen">📄<br>Resumen</button>
<button onclick="mostrar('calendario')" id="b-calendario">📅<br>Calendario</button>
</nav>
<script>
let _old=JSON.parse(localStorage.getItem('slyapp_v16')||localStorage.getItem('slyapp_v15')||'{}');
let datos=JSON.parse(localStorage.getItem('slyapp_v69')||'null')||{tarjetas:_old.tarjetas||[],consumos:_old.consumos||[],ingresosPorMes:{},gastosPorMes:{}};
// Migrar tarjetas viejas a nuevo formato con cierre editable
datos.tarjetas=(datos.tarjetas||[]).map(t=>({nombre:t.nombre,banco:t.banco||'',ultimos:t.ultimos||'',cierreDia:t.cierreDia||t.cierre||25,cierreMes:t.cierreMes||12,vencDia:t.vencDia||t.vencimiento||5,vencMes:t.vencMes||1}));
if(datos.tarjetas.length===0) datos.tarjetas=[{nombre:'Visa',banco:'Santander',ultimos:'',cierreDia:25,cierreMes:12,vencDia:5,vencMes:1},{nombre:'Amex',banco:'Santander',ultimos:'',cierreDia:25,cierreMes:12,vencDia:5,vencMes:1}];
if(!datos.consumos) datos.consumos=[]; if(!datos.ingresosPorMes) datos.ingresosPorMes={}; if(!datos.gastosPorMes) datos.gastosPorMes={};
let vista='inicio'; let resumenDetectado=[]; let mesAbierto='2026-12';
const MESES_L=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MESES_N=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
// SOLO Dic 2026 a Dic 2027
const LISTA_MESES=[]; for(let y=2026;y<=2027;y++){ for(let m=0;m<12;m++){ if(y===2026&&m<11) continue; LISTA_MESES.push(y+'-'+String(m+1).padStart(2,'0')); } }
function guardar(){localStorage.setItem('slyapp_v69',JSON.stringify(datos));}
function formato(n){return '$ '+Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function mesNombreClave(k){let [y,m]=k.split('-').map(Number); return MESES_L[m-1]+' '+y;}
function mesNombre(y,m){return MESES_N[m]+' '+y;}
function parseFechaTexto(txt){const MESES={enero:0,febrero:1,marzo:2,abril:3,mayo:4,junio:5,julio:6,agosto:7,septiembre:8,octubre:9,noviembre:10,diciembre:11}; let m=txt.toLowerCase().match(/(\d{1,2})\s+de\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)/); if(!m) return null; return {dia:parseInt(m[1]),mes:MESES[m[2]]};}
function fechaCompraDe(c){let d=new Date(c.fechaInicio+'T00:00:00'); return d.getDate()+' de '+MESES_L[d.getMonth()]+' '+d.getFullYear();}
function cuotaDelMes(c,clave){let inicio=new Date(c.fechaInicio+'T00:00:00'); let [y,m]=clave.split('-').map(Number); let dif=(y-inicio.getFullYear())*12+(m-1-inicio.getMonth()); if(dif<0||dif>=c.cuotas) return 0; return c.montoTotal/c.cuotas;}
function totalMes(clave,tarjetaFiltro){return datos.consumos.filter(c=>!tarjetaFiltro||c.tarjeta===tarjetaFiltro||c.tarjeta.includes(tarjetaFiltro)).reduce((a,c)=>a+cuotaDelMes(c,clave),0);}
function totalIngresosMes(clave){return (datos.ingresosPorMes[clave]||[]).reduce((a,i)=>a+(parseFloat(i.monto)||0),0);}
function totalGastosMes(clave){return (datos.gastosPorMes[clave]||[]).reduce((a,g)=>a+(parseFloat(g.monto)||0),0);}
function mostrar(v){vista=v; document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('activo')); let b=document.getElementById('b-'+v); if(b) b.classList.add('activo'); render(); window.scrollTo(0,0);}
function toggleMes(k){mesAbierto=(mesAbierto===k? '':k); render();}
function render(){
 let el=document.getElementById('app'); let clave=mesAbierto||'2026-12';
 // INICIO
 if(vista==='inicio'){
  let totIng=totalIngresosMes(clave); let totTarj=totalMes(clave); let totGas=totalGastosMes(clave); let saldo=totIng-totTarj-totGas;
  el.innerHTML=`<div class="card"><div class="titulo t-inicio">🏠 INICIO</div>
  <p class="mutual">Mes: <b>${mesNombreClave(clave)}</b> - tocá un mes abajo para cambiar</p>
  <div class="total" style="color:${saldo>=0?'#16a34a':'#dc2626'}">${formato(saldo)}</div><p class="mutual">Te queda después de pagar todo.</p>
  <div class="saldoBox"><div><small>💵 Ingresos</small><br><b style="color:#16a34a">${formato(totIng)}</b></div><div><small>💳 Tarjetas</small><br><b style="color:#dc2626">-${formato(totTarj)}</b></div><div><small>🧾 Gastos</small><br><b style="color:#ea580c">-${formato(totGas)}</b></div></div>
  <div class="fila"><button class="btn btn-green" onclick="mostrar('resumen')">📄 Pegar Resumen</button><button class="btn btn-blue" onclick="mostrar('agregar')">➕ Nuevo Consumo</button></div></div>
  <div class="card"><h2>📅 Calendario - Próximos vencimientos</h2><p class="mutual">🟢 Ingreso &nbsp; 🟠 Gasto &nbsp; 🔵 Visa &nbsp; 🟣 Amex - tocá el mes para ver el detalle del día</p>
  ${LISTA_MESES.map(k=>{let tot=totalMes(k); let cant=datos.consumos.filter(c=>cuotaDelMes(c,k)>0).length; let g=datos.gastosPorMes[k]||[]; return `<div class="mesBox ${mesAbierto===k?'abierto':''}" onclick="toggleMes('${k}')"><div style="display:flex;justify-content:space-between"><b class="tituloMes">${mesNombreClave(k)}</b><b>${formato(tot+totalGastosMes(k))}</b></div><p class="mutual">${cant} cuotas tarjetas + ${g.length} gastos • Ingresos ${formato(totalIngresosMes(k))}</p>${mesAbierto===k?`<div>${datos.consumos.filter(c=>cuotaDelMes(c,k)>0).map(c=>`<div class="cuotaRow"><span style="display:flex;gap:8px;align-items:center"><span class="dot" style="background:${c.tarjeta.toLowerCase().includes('amex')?'#7c3aed':'#2563eb'}"></span><span><b>${c.descripcion}</b><br><span class="mutual">${c.tarjeta} • Cuota</span></span></span><b>${formato(cuotaDelMes(c,k))}</b></div>`).join('')||'<p class="mutual">Sin cuotas</p>'}${g.map((gg,i)=>`<div class="cuotaRow"><span style="display:flex;gap:8px;align-items:center"><span class="dot" style="background:#ea580c"></span><span><b>${gg.descripcion}</b><br><span class="mutual">Gasto • Vence día ${gg.vencimiento||'-'}</span></span></span><b>${formato(gg.monto)}</b></div>`).join('')}</div>`:''}</div>`}).join('')}</div>`;
 }
 // SUELDO / INGRESOS
 if(vista==='ingresos'){
  el.innerHTML=`<div class="card"><div class="titulo t-sueldo">💵 SUELDO / INGRESOS</div><p class="mutual">Variables mes a mes. Se carga manual y se puede editar. Se ve solo el mes, al desplegar se ven los montos.</p></div>
  ${LISTA_MESES.map(k=>{let arr=datos.ingresosPorMes[k]||[]; let tot=totalIngresosMes(k); return `<div class="card"><div class="mesBox" style="border:none;padding:0" onclick="toggleMes('${k}')"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:18px;color:#166534">📅 ${mesNombreClave(k)}</b><b style="color:#16a34a">${formato(tot)}</b></div><p class="mutual">${arr.length} ingresos • Tocá para desplegar ▼</p></div>${mesAbierto===k?`<div>${arr.map((ing,i)=>`<div class="item"><div><b>${ing.descripcion}</b><br><span class="mutual">${ing.tipo||'Ingreso'}</span></div><div><b style="color:#16a34a">${formato(ing.monto)}</b> <span class="edit" onclick="editarIngreso('${k}',${i})">✏️</span> <span class="x" onclick="borrarIngreso('${k}',${i})">✕</span></div></div>`).join('')||'<p class="mutual">Sin ingresos este mes.</p>'}
  <label>¿De qué es? - ${mesNombreClave(k)}</label><input id="ing-desc-${k}" placeholder="Ej: Sueldo, Extra"><label>Monto</label><input id="ing-monto-${k}" type="number" placeholder="Ej: 800000"><button class="btn btn-green" onclick="agregarIngreso('${k}')">💵 Guardar ingreso en ${mesNombreClave(k)}</button></div>`:''}</div>`}).join('')}`;
 }
 // GASTOS
 if(vista==='gastos'){
  el.innerHTML=`<div class="card"><div class="titulo t-gastos">🧾 ESTADO - GASTOS POR MES</div><div style="text-align:center;background:#ffedd5;color:#9a3412;font-weight:900;font-size:18px;padding:12px;border-radius:12px">🧾 GASTOS POR MES</div></div>
  ${LISTA_MESES.map(k=>{let arr=datos.gastosPorMes[k]||[]; let tot=totalGastosMes(k); return `<div class="card"><div class="mesBox" style="border:none;padding:0" onclick="toggleMes('${k}')"><div style="display:flex;justify-content:space-between"><b style="font-size:18px;color:#9a3412">📅 ${mesNombreClave(k)}</b><b style="color:#ea580c">${formato(tot)}</b></div><p class="mutual">${arr.length} gastos • Tocá para desplegar ▼</p></div>${mesAbierto===k?`<div>${arr.map((g,i)=>`<div class="item"><div><b>${g.descripcion}</b><br><span class="mutual">${g.categoria||'Servicios'} • Vence día ${g.vencimiento||'-'}</span></div><div><b style="color:#ea580c">${formato(g.monto)}</b> <span class="edit" onclick="editarGasto('${k}',${i})">✏️</span> <span class="x" onclick="borrarGasto('${k}',${i})">✕</span></div></div>`).join('')||'<p class="mutual">Sin gastos este mes.</p>'}</div>`:''}</div>`}).join('')}
  <div class="card"><div class="titulo t-gastos" style="font-size:18px">🧾 CARGAR GASTOS</div><label>Mes</label><select id="gas-mes">${LISTA_MESES.map(k=>`<option value="${k}" ${k===mesAbierto?'selected':''}>${mesNombreClave(k)}</option>`).join('')}</select><label>Servicio / Gasto</label><input id="gas-desc" placeholder="Ej: Luz, Internet, Alquiler"><label>Categoría</label><select id="gas-cat"><option>Servicios</option><option>Alquiler</option><option>Internet / Celular</option><option>Transporte</option><option>Comida</option><option>Salud</option><option>Educación</option><option>Otros</option></select><label>Monto</label><input id="gas-monto" type="number" placeholder="Ej: 45000"><label>Día que vence</label><input id="gas-venc" type="number" placeholder="Ej: 10"><button class="btn btn-orange" onclick="agregarGastoForm()">🧾 Guardar gasto</button></div>`;
 }
 // TARJETAS
 if(vista==='tarjetas'){
  let html=`<div class="card"><div class="titulo t-tarjetas">🎯 CONTROL - TARJETAS</div><div style="text-align:center;background:#ede9fe;color:#5b21b6;font-weight:900;font-size:18px;padding:12px;border-radius:12px">CONSUMOS POR MES</div><p class="mutual" style="margin-top:8px">Tocá un mes para ver sus consumos.</p>${LISTA_MESES.map(k=>`<div class="mesBox" onclick="toggleMes('${k}')"><div style="display:flex;justify-content:space-between"><b>${mesNombreClave(k)}</b><b>${formato(totalMes(k))}</b></div>${mesAbierto===k?`<div>${datos.consumos.filter(c=>cuotaDelMes(c,k)>0).map(c=>`<div class="cuotaRow"><span><b>${c.descripcion}</b><br><span class="mutual">${c.tarjeta} • ${formato(cuotaDelMes(c,k))}</span></span><b>${formato(cuotaDelMes(c,k))}</b></div>`).join('')||'<p class="mutual">Sin consumos</p>'}</div>`:''}</div>`).join('')}</div>`;
  datos.tarjetas.forEach((t,ti)=>{
   let esAmex=t.nombre.toLowerCase().includes('amex');
   html+=`<div class="estadoCard ${esAmex?'estadoAmex':'estadoVisa'}" onclick="toggleMes('tarj${ti}')"><div class="big">${esAmex?'🟣':'🔵'} ESTADO ${t.nombre.toUpperCase()} ▼</div><p style="font-size:13px;opacity:.9">${t.banco||''} •••• ${t.ultimos||''} • Este mes: ${formato(totalMes(clave,t.nombre))}</p>${mesAbierto==='tarj'+ti?`<div style="background:white;color:#1e293b;border-radius:12px;padding:12px;margin-top:10px" onclick="event.stopPropagation()"><label>Cierre - Día</label><input id="cierre-dia-${ti}" type="number" value="${t.cierreDia}"><label>Cierre - Mes</label><select id="cierre-mes-${ti}">${MESES_L.map((m,i)=>`<option value="${i+1}" ${t.cierreMes==i+1?'selected':''}>${m}</option>`).join('')}</select><label>Vencimiento - Día</label><input id="venc-dia-${ti}" type="number" value="${t.vencDia}"><label>Vencimiento - Mes</label><select id="venc-mes-${ti}">${MESES_L.map((m,i)=>`<option value="${i+1}" ${t.vencMes==i+1?'selected':''}>${m}</option>`).join('')}</select><button class="btn btn-purple" onclick="guardarTarjeta(${ti})">💾 Guardar cierre y vencimiento</button><p class="mutual" style="margin-top:8px">Próximos vencimientos de ${t.nombre} aparecen en Calendario e Inicio con color ${esAmex?'violeta':'azul'}.</p></div>`:''}</div>`;
  });
  html+=`<div class="card"><h2>➕ Nueva Tarjeta</h2><label>Nombre</label><input id="nt-nombre" placeholder="Visa / Amex"><label>Banco</label><input id="nt-banco" placeholder="Santander"><label>Últimos 4</label><input id="nt-ultimos" placeholder="2688"><button class="btn btn-blue" onclick="crearTarjeta()">Guardar tarjeta</button></div>`;
  el.innerHTML=html;
 }
 // AGREGAR
 if(vista==='agregar'){
  el.innerHTML=`<div class="card"><div class="titulo t-agregar">➕ AGREGAR</div><h2>Cargar Consumo Manual</h2><label>Tarjeta</label><select id="c-tarjeta">${datos.tarjetas.map(t=>`<option value="${t.nombre}">${t.nombre}</option>`).join('')}</select><label>¿Qué compraste?</label><input id="c-desc" placeholder="Ej: Farmacity"><label>Monto total</label><input id="c-monto" type="number" placeholder="60000"><label>Cuotas</label><input id="c-cuotas" type="number" value="1"><label>Fecha de compra</label><input id="c-fecha" type="date"><button class="btn btn-pink" onclick="agregarConsumo()">Guardar y sumar</button><p class="mutual">Al guardarlo, las cuotas restantes se cargan solas en Calendario, Inicio y Tarjetas.</p></div>`;
 }
 // RESUMEN
 if(vista==='resumen'){
  el.innerHTML=`<div class="card"><div class="titulo t-resumen">📄 RESUMEN</div><div class="alerta">Pegá TODO junto. Detecta fecha, cuota actual, cuotas restantes y mes que termina. Al importar, las cuotas restantes se cargan en Calendario y vencimientos.</div><label>¿De qué tarjeta es?</label><select id="resumen-tarjeta">${datos.tarjetas.map(t=>`<option value="${t.nombre}">${t.nombre}</option>`).join('')}</select><label>Pegá acá el texto</label><textarea id="resumen-texto" placeholder="Pegá acá todo el texto copiado del banco..."></textarea><button class="btn btn-blue" onclick="analizarResumen()">🔍 Analizar resumen</button><div id="previewResumen"></div><button class="btn btn-gray" onclick="document.getElementById('resumen-texto').value='';document.getElementById('previewResumen').innerHTML=''">Limpiar</button></div>`;
 }
 // CALENDARIO
 if(vista==='calendario'){
  el.innerHTML=`<div class="card"><div class="titulo t-calendario">📅 CALENDARIO</div><p class="mutual">🟢 Ingreso 🟠 Gasto 🔵 Visa 🟣 Amex - Cada color es un tipo de vencimiento. Tocá el día/mes para ver el detalle.</p>${LISTA_MESES.map(k=>{let cons=datos.consumos.filter(c=>cuotaDelMes(c,k)>0); let g=datos.gastosPorMes[k]||[]; let ing=datos.ingresosPorMes[k]||[]; return `<div class="mesBox ${mesAbierto===k?'abierto':''}" onclick="toggleMes('${k}')"><div style="display:flex;justify-content:space-between"><b>${mesNombreClave(k)}</b><b>${formato(totalMes(k)+totalGastosMes(k))}</b></div><p class="mutual">Tarjetas ${formato(totalMes(k))} + Gastos ${formato(totalGastosMes(k))} = ${formato(totalMes(k)+totalGastosMes(k))} • Ingresos ${formato(totalIngresosMes(k))}</p>${mesAbierto===k?`<div>${ing.map(x=>`<div class="cuotaRow"><span style="display:flex;gap:8px;align-items:center"><span class="dot" style="background:#16a34a"></span><span><b>${x.descripcion}</b><br><span class="mutual">Ingreso</span></span></span><b style="color:#16a34a">${formato(x.monto)}</b></div>`).join('')}${cons.map(c=>{let inicio=new Date(c.fechaInicio+'T00:00:00'); let num=(parseInt(k.split('-')[0])-inicio.getFullYear())*12+(parseInt(k.split('-')[1])-1-inicio.getMonth())+1; return `<div class="cuotaRow"><span style="display:flex;gap:8px;align-items:center"><span class="dot" style="background:${c.tarjeta.toLowerCase().includes('amex')?'#7c3aed':'#2563eb'}"></span><span><b>${c.descripcion}</b><br><span class="mutual">${c.tarjeta} • Cuota ${num} de ${c.cuotas}</span></span></span><b>${formato(cuotaDelMes(c,k))}</b></div>`}).join('')}${g.map(x=>`<div class="cuotaRow"><span style="display:flex;gap:8px;align-items:center"><span class="dot" style="background:#ea580c"></span><span><b>${x.descripcion}</b><br><span class="mutual">Gasto • Vence día ${x.vencimiento||'-'}</span></span></span><b>${formato(x.monto)}</b></div>`).join('')||''}${cons.length===0&&g.length===0&&ing.length===0?'<p class="mutual">Sin vencimientos</p>':''}</div>`:''}</div>`}).join('')}</div>`;
 }
}
function crearTarjeta(){let n=document.getElementById('nt-nombre').value.trim(); if(!n) return alert('Poné nombre'); datos.tarjetas.push({nombre:n,banco:document.getElementById('nt-banco').value,ultimos:document.getElementById('nt-ultimos').value,cierreDia:25,cierreMes:12,vencDia:5,vencMes:1}); guardar(); render();}
function guardarTarjeta(i){let t=datos.tarjetas[i]; t.cierreDia=parseInt(document.getElementById('cierre-dia-'+i).value)||25; t.cierreMes=parseInt(document.getElementById('cierre-mes-'+i).value)||12; t.vencDia=parseInt(document.getElementById('venc-dia-'+i).value)||5; t.vencMes=parseInt(document.getElementById('venc-mes-'+i).value)||1; guardar(); alert('✅ Cierre y vencimiento guardados'); render();}
function agregarIngreso(k){let d=document.getElementById('ing-desc-'+k).value.trim(); let m=parseFloat(document.getElementById('ing-monto-'+k).value); if(!d||!m) return alert('Completá qué es y monto'); if(!datos.ingresosPorMes[k]) datos.ingresosPorMes[k]=[]; datos.ingresosPorMes[k].push({descripcion:d,monto:m,tipo:'Ingreso'}); guardar(); render();}
function editarIngreso(k,i){let it=datos.ingresosPorMes[k][i]; let nm=prompt('Nuevo monto para '+it.descripcion, it.monto); if(nm===null) return; let nd=prompt('Nueva descripción', it.descripcion); if(nd) it.descripcion=nd; it.monto=parseFloat(nm)||it.monto; guardar(); render();}
function borrarIngreso(k,i){if(!confirm('¿Borrar?'))return; datos.ingresosPorMes[k].splice(i,1); guardar(); render();}
function agregarGastoForm(){let k=document.getElementById('gas-mes').value; let d=document.getElementById('gas-desc').value.trim(); let m=parseFloat(document.getElementById('gas-monto').value); if(!d||!m) return alert('Completá servicio y monto'); if(!datos.gastosPorMes[k]) datos.gastosPorMes[k]=[]; datos.gastosPorMes[k].push({descripcion:d,monto:m,categoria:document.getElementById('gas-cat').value,vencimiento:document.getElementById('gas-venc').value}); guardar(); mesAbierto=k; render();}
function editarGasto(k,i){let it=datos.gastosPorMes[k][i]; let nm=prompt('Nuevo monto para '+it.descripcion, it.monto); if(nm===null) return; it.monto=parseFloat(nm)||it.monto; guardar(); render();}
function borrarGasto(k,i){if(!confirm('¿Borrar?'))return; datos.gastosPorMes[k].splice(i,1); guardar(); render();}
function agregarConsumo(){let tarjeta=document.getElementById('c-tarjeta').value; let desc=document.getElementById('c-desc').value.trim(); let monto=parseFloat(document.getElementById('c-monto').value); let cuotas=parseInt(document.getElementById('c-cuotas').value)||1; let fecha=document.getElementById('c-fecha').value||new Date().toISOString().slice(0,10); if(!tarjeta||!desc||!monto) return alert('Completá tarjeta, descripción y monto'); datos.consumos.push({descripcion:desc,montoTotal:monto,tarjeta,categoria:'Otros',cuotas,fechaInicio:fecha,cuotaActual:1,valorCuota:monto/cuotas}); guardar(); alert('✅ Guardado! Cuotas restantes ya están en Calendario.'); mostrar('inicio');}
function mostrarPreview(){const preview=document.getElementById('previewResumen'); const tarjeta=document.getElementById('resumen-tarjeta').value; preview.innerHTML=`<div style="margin-top:14px;background:#ecfdf5;padding:14px;border-radius:12px"><b>✅ Detecté ${resumenDetectado.length} consumos en ${tarjeta}:</b>${resumenDetectado.map((r,i)=>`<div style="padding:10px 0;border-bottom:1px solid #ddd;font-size:14px"><b>${r.descripcion}</b><br><small>📅 ${fechaCompraDe(r)} • Cuota ${r.cuotaActual} de ${r.cuotas}</small><br><b>${formato(r.valorCuota)} /mes</b> • Quedan ${r.cuotas-r.cuotaActual+1} cuotas • <span style="color:red;cursor:pointer" onclick="quitarDeResumen(${i})">Quitar</span></div>`).join('')}<button class="btn btn-green" onclick="importarResumen()">✅ Importar todo a ${tarjeta} - Se cargan cuotas restantes en Calendario</button></div>`;}
function analizarResumen(){const texto=document.getElementById('resumen-texto').value.trim(); const tarjeta=document.getElementById('resumen-tarjeta').value; const preview=document.getElementById('previewResumen'); if(!texto) return alert('Pegá primero el resumen'); resumenDetectado=[]; const lineas=texto.split('\n').map(l=>l.trim()).filter(l=>l!==''); let descActual=''; let cuotaActual=1,cuotasTotales=1; let esperandoMonto=false; let fechaActualObj=null; const ignorar=['subtotal','otros conceptos','db iva','adicional de','visa crédito terminada','2026','u$s','$ 0,00']; for(let i=0;i<lineas.length;i++){let linea=lineas[i]; let lineaBaja=linea.toLowerCase(); if(ignorar.some(x=>lineaBaja.includes(x))) continue; let pf=parseFechaTexto(linea); if(pf){fechaActualObj=pf; continue;} if(linea==='$'||linea==='U$S') continue; let mCuota=linea.match(/cuota\s*(\d{1,2})\s*de\s*(\d{1,2})/i); if(mCuota){cuotaActual=parseInt(mCuota[1]); cuotasTotales=parseInt(mCuota[2]); esperandoMonto=true; continue;} let mUnaLinea=linea.match(/^(.+?)\s+(\d{1,2})\/(\d{1,2})\s+\$?\s*(-?[\d\.]+,?\d*)$/); if(mUnaLinea && !esperandoMonto){let monto=parseFloat(mUnaLinea[4].replace(/\./g,'').replace(',','.')); if(monto>0){let hoy=new Date(); let cA=parseInt(mUnaLinea[2]); let cT=parseInt(mUnaLinea[3]); let fechaInicio=new Date(hoy.getFullYear(),fechaActualObj?fechaActualObj.mes:hoy.getMonth(),fechaActualObj?fechaActualObj.dia:hoy.getDate()); resumenDetectado.push({descripcion:mUnaLinea[1].slice(0,40),montoTotal:monto*cT,tarjeta,categoria:'Otros',cuotas:cT,fechaInicio:fechaInicio.toISOString().slice(0,10),cuotaActual:cA,valorCuota:monto});} continue;} let mMonto=linea.match(/^\$?\s*(-?[\d\.]+,\d{2})$/); if(mMonto||(linea.match(/^-?[\d\.]+,\d{2}$/)&&esperandoMonto)){let monto=parseFloat((mMonto?mMonto[1]:linea).replace(/\./g,'').replace(',','.')); if(!monto||monto<=0){esperandoMonto=false; descActual=''; continue;} if(!descActual) descActual='Consumo '+tarjeta; let hoy=new Date(); let fechaInicio=new Date(hoy.getFullYear(),fechaActualObj?fechaActualObj.mes:hoy.getMonth(),fechaActualObj?fechaActualObj.dia:hoy.getDate()); resumenDetectado.push({descripcion:descActual.slice(0,40),montoTotal:monto*cuotasTotales,tarjeta,categoria:'Otros',cuotas:cuotasTotales,fechaInicio:fechaInicio.toISOString().slice(0,10),cuotaActual,valorCuota:monto}); descActual=''; cuotaActual=1; cuotasTotales=1; esperandoMonto=false; continue;} if(!esperandoMonto){descActual=linea;} else {descActual=linea; cuotaActual=1; cuotasTotales=1; esperandoMonto=false;}} if(!resumenDetectado.length){preview.innerHTML=`<p style="color:red;margin-top:10px">No detecté nada. Pegá con formato Santander.</p>`; return;} mostrarPreview();}
function quitarDeResumen(i){resumenDetectado.splice(i,1); if(!resumenDetectado.length){document.getElementById('previewResumen').innerHTML=''; return;} mostrarPreview();}
function importarResumen(){if(!resumenDetectado.length) return alert('No hay nada'); let nuevos=0; resumenDetectado.forEach(r=>{let existe=datos.consumos.some(c=>c.tarjeta===r.tarjeta && c.descripcion===r.descripcion && Math.abs(c.montoTotal-r.montoTotal)<1 && c.cuotas===r.cuotas && c.fechaInicio===r.fechaInicio); if(!existe){datos.consumos.push(r); nuevos++;}}); guardar(); alert('✅ Se sumaron '+nuevos+' consumos. Las cuotas restantes ya están en Calendario, Inicio y Tarjetas.'); resumenDetectado=[]; mostrar('calendario');}
mostrar('inicio');
</script>
