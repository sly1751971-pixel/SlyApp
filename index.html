<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlyApp - Mis Finanzas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#f1f5f9;padding-bottom:115px;color:#1e293b}
header{background:#0f172a;color:white;padding:18px;text-align:center;position:sticky;top:0;z-index:10;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
header h1{font-size:20px} header p{font-size:13px;opacity:.8}
.container{max-width:520px;margin:0 auto;padding:14px}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
h2{font-size:17px;margin-bottom:10px} h3{font-size:15px;margin:14px 0 8px}
label{font-size:13px;font-weight:600;display:block;margin-top:10px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;margin-top:4px;font-size:15px;background:white}
textarea{min-height:180px}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;margin-top:10px}
.btn-green{background:#16a34a;color:white}.btn-blue{background:#2563eb;color:white}.btn-gray{background:#e2e8f0;color:#334155}.btn-orange{background:#ea580c;color:white}.btn-purple{background:#7c3aed;color:white}.btn-red{background:#dc2626;color:white}.btn-dark{background:#0f172a;color:white}
.fila{display:flex;gap:8px}.fila .btn{flex:1}
.total{font-size:28px;font-weight:800}.mutual{font-size:13px;color:#64748b}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9;gap:8px}
.x{color:red;cursor:pointer;font-weight:800;padding:6px 10px;font-size:18px;flex-shrink:0}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;overflow-x:auto;border-top:2px solid #2563eb;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:999;box-shadow:0 -2px 10px rgba(0,0,0,.1);scrollbar-width:none}
.bottom::-webkit-scrollbar{display:none}
.bottom button{flex:1;min-width:62px;background:none;border:none;padding:8px 2px;font-size:12px;cursor:pointer;color:#64748b;line-height:1.2;white-space:nowrap}
.bottom button.activo{color:#2563eb;font-weight:800;background:#eff6ff;border-radius:10px}
.mesBox{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:8px}
.alerta{background:#fef3c7;border:1px solid #fbbf24;padding:12px;border-radius:12px;font-size:14px;line-height:1.5}
.alerta-verde{background:#dcfce7;border:1px solid #16a34a;padding:12px;border-radius:12px;font-size:14px;line-height:1.5}
.alerta-azul{background:#eff6ff;border:1px solid #2563eb;padding:12px;border-radius:12px;font-size:14px;line-height:1.5}
.badge{background:#16a34a;color:white;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.badge-rojo{background:#dc2626;color:white;padding:3px 9px;border-radius:10px;font-size:12px;font-weight:800}
.badge-naranja{background:#ea580c;color:white;padding:3px 9px;border-radius:10px;font-size:12px;font-weight:800}
.badge-gris{background:#64748b;color:white;padding:3px 9px;border-radius:10px;font-size:12px;font-weight:700}
.cuotaRow{display:flex;justify-content:space-between;gap:8px;padding:9px 8px;border-bottom:1px solid #f1f5f9;font-size:13px;align-items:center}
.cuotaRow:last-child{border:none}
.cuotaRow.destacada{background:#fef3c7;border-left:4px solid #ea580c;border-radius:8px}
.cuotaRow.ultima{background:#fee2e2;border-left:4px solid #dc2626;border-radius:8px}
.saldoBox{display:flex;gap:8px;margin-top:10px}
.saldoBox div{flex:1;background:#f8fafc;border-radius:12px;padding:10px;text-align:center}
.debug{background:#0f172a;color:#a7f3d0;padding:10px;border-radius:10px;font-size:12px;white-space:pre-wrap;word-break:break-word;margin-top:10px}
.resumenCuotas{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.resumenCuotas span{padding:6px 10px;border-radius:10px;font-size:12px;font-weight:700}
.controlTotal{background:#0f172a;color:white;border-radius:16px;padding:16px;text-align:center;margin-bottom:12px}
.controlTotal .big{font-size:30px;font-weight:800}
.controlConsumo{background:white;border-radius:16px;padding:14px;margin-bottom:10px;border-left:5px solid #2563eb;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.controlConsumo.ultima{border-left-color:#dc2626;background:#fff5f5}
.controlConsumo.destacada{border-left-color:#ea580c;background:#fffbeb}
.cuotaGrande{display:inline-block;background:#2563eb;color:white;padding:6px 12px;border-radius:12px;font-weight:800;font-size:18px;margin:6px 0}
.cuotaGrande.rojo{background:#dc2626}
.cuotaGrande.naranja{background:#ea580c}
.btn-mini{padding:8px 10px;border:none;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer}
.badge-aprox{background:#f59e0b;color:white;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:700}
.mesFila{background:white;border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;border:2px solid transparent}
.mesFila.abierto{border-color:#2563eb}
.mesGrande{font-size:22px;font-weight:800;text-transform:uppercase}
.cierreGrande{background:#fef3c7;border-radius:14px;padding:14px;text-align:center;margin:10px 0}
.cierreGrande b{font-size:20px}
</style>
</head>
<body>
<header id="cabecera"><h1>💳 SlyApp</h1><p>Ingresos • Gastos • Tarjetas • Cuotas</p></header>
<div class="container" id="app"><div class="card"><p>Cargando...</p><button class="btn btn-red" onclick="window.recuperarForzado && window.recuperarForzado()">🔧 Recuperar mis datos</button></div></div>
<nav class="bottom">
<button onclick="mostrar('inicio')" id="b-inicio">🏠<br>Inicio</button>
<button onclick="mostrar('control')" id="b-control">🎯<br>Control</button>
<button onclick="mostrar('ingresos')" id="b-ingresos">💰<br>Ingresos</button>
<button onclick="mostrar('gastos')" id="b-gastos">🧾<br>Gastos</button>
<button onclick="mostrar('tarjetas')" id="b-tarjetas">💳<br>Tarjetas</button>
<button onclick="mostrar('agregar')" id="b-agregar">➕<br>Agregar</button>
<button onclick="mostrar('resumen')" id="b-resumen">📄<br>Resumen</button>
<button onclick="mostrar('calendario')" id="b-calendario">📅<br>Calendario</button>
</nav>
<script>
window.recuperarForzado=function(){try{let keys=[];for(let i=0;i<localStorage.length;i++){keys.push(localStorage.key(i));}let mejor=null;keys.forEach(k=>{try{let d=JSON.parse(localStorage.getItem(k)||'null');if(d&&d.consumos&&(!mejor||d.consumos.length>mejor.consumos.length)) mejor=d;}catch(e){}});if(mejor){localStorage.setItem('slyapp_v42',JSON.stringify(mejor));alert('✅ Encontré '+mejor.consumos.length+' consumos. Recargá con ?v=42');location.reload();}else{alert('No encontré datos viejos en esta tablet.');}}catch(e){alert('Error: '+e.message);}};
try{
function baseVacia(){return {tarjetas:[],consumos:[],ingresos:[],gastos:[],cierre:'19/11/2026',vencimiento:'01/12/2026',proxCierre:'23/12/2026',proxVencimiento:'04/01/2027',cierres:[{cierre:'19/11/2026',vencimiento:'01/12/2026',aprox:false},{cierre:'23/12/2026',vencimiento:'04/01/2027',aprox:false}],tarjetasOcultas:[],consumosOcultos:[],pin:'1234'};}
function cierresAproximados(){return [{cierre:'22/01/2027',vencimiento:'03/02/2027',aprox:true},{cierre:'21/02/2027',vencimiento:'05/03/2027',aprox:true},{cierre:'23/03/2027',vencimiento:'04/04/2027',aprox:true},{cierre:'22/04/2027',vencimiento:'04/05/2027',aprox:true},{cierre:'21/05/2027',vencimiento:'02/06/2027',aprox:true},{cierre:'22/06/2027',vencimiento:'04/07/2027',aprox:true}];}
function cargarTodo(){
  let base=baseVacia();
  try{
    ['slyapp_v41','slyapp_v40','slyapp_v39','slyapp_v38','slyapp_v37','slyapp_v36','slyapp_v35','slyapp_v34','slyapp_v33'].forEach(k=>{
      try{let d=JSON.parse(localStorage.getItem(k)||'null');if(!d||typeof d!=='object') return;
        if(Array.isArray(d.tarjetas)&&d.tarjetas.length>base.tarjetas.length) base.tarjetas=d.tarjetas;
        if(Array.isArray(d.consumos)&&d.consumos.length>base.consumos.length) base.consumos=d.consumos;
        if(Array.isArray(d.ingresos)&&d.ingresos.length>base.ingresos.length) base.ingresos=d.ingresos;
        if(Array.isArray(d.gastos)&&d.gastos.length>base.gastos.length) base.gastos=d.gastos;
        if(d.cierre) base.cierre=d.cierre; if(d.vencimiento) base.vencimiento=d.vencimiento;
        if(d.proxCierre) base.proxCierre=d.proxCierre; if(d.proxVencimiento) base.proxVencimiento=d.proxVencimiento;
        if(Array.isArray(d.cierres)&&d.cierres.length) base.cierres=d.cierres;
        if(Array.isArray(d.tarjetasOcultas)) base.tarjetasOcultas=d.tarjetasOcultas;
        if(Array.isArray(d.consumosOcultos)) base.consumosOcultos=d.consumosOcultos;
        if(d.pin) base.pin=d.pin;
      }catch(e){}
    });
  }catch(e){base=baseVacia();}
  if(!Array.isArray(base.tarjetas)) base.tarjetas=[];
  if(!Array.isArray(base.consumos)) base.consumos=[];
  if(!Array.isArray(base.ingresos)) base.ingresos=[];
  if(!Array.isArray(base.gastos)) base.gastos=[];
  if(!Array.isArray(base.cierres)||!base.cierres.length) base.cierres=[{cierre:'19/11/2026',vencimiento:'01/12/2026',aprox:false},{cierre:'23/12/2026',vencimiento:'04/01/2027',aprox:false}];
  cierresAproximados().forEach(ap=>{if(!base.cierres.some(c=>c.cierre===ap.cierre)) base.cierres.push(ap);});
  base.cierres.sort((a,b)=>{let fa=parseFechaCorta(a.cierre);let fb=parseFechaCorta(b.cierre);return (fa||new Date())-(fb||new Date());});
  if(!Array.isArray(base.tarjetasOcultas)) base.tarjetasOcultas=[];
  if(!Array.isArray(base.consumosOcultos)) base.consumosOcultos=[];
  if(!base.pin) base.pin='1234';
  try{
    base.gastos.forEach(g=>{if(!g.categoria) g.categoria='Gastos generales';});
    base.consumos.forEach(c=>{if(c&&c.fechaTexto&&c.cuotaActual&&c.cuotaActual>1&&!c.corregidoV27){c.fechaCompraReal=c.fechaTexto;let dia=parseInt(String(c.fechaTexto).split('/')[0])||1;let inicio=new Date(2026,10-(c.cuotaActual-1),dia);c.fechaInicio=inicio.toISOString().slice(0,10);c.corregidoV27=true;}});
    base.ingresos.forEach(i=>{if(!i.fecha) i.fecha='';});
  }catch(e){}
  return base;
}
let datos=cargarTodo();
let vista='inicio';let resumenDetectado=[];let desbloqueado=false;let tarjetaSeleccionada='';let mesSeleccionado='';let controlTarjeta='';let mesAbierto='2026-11';
function mesesHastaJunio2027(){let hoy=new Date();let arr=[];let d=new Date(hoy.getFullYear(),hoy.getMonth(),1);let fin=new Date(2027,5,1);while(d<=fin){arr.push(mesClave(d));d=new Date(d.getFullYear(),d.getMonth()+1,1);}return arr;}
function guardar(){try{localStorage.setItem('slyapp_v42',JSON.stringify(datos));}catch(e){}}
function recuperarTodo(){try{let b=cargarTodo();datos=b;guardar();alert('✅ Recuperado: '+datos.consumos.length+' consumos');vista='inicio';render();}catch(e){datos=baseVacia();render();}}
function formato(n){let v=Number(n);if(isNaN(v)) v=0;return '$ '+v.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});}
const MESES_L=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MESES_N=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function mesNombre(y,m){return MESES_N[m]+' '+y;}
function mesNombreLargo(y,m){return MESES_L[m]+' '+y;}
function mesClave(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function mesClaveDeFecha(f){if(!f) return null;try{return mesClave(new Date(f+'T00:00:00'));}catch(e){return null;}}
function fechaCompraDe(c){try{if(c.fechaCompraReal){let p=String(c.fechaCompraReal).split('/');if(p.length===3) return parseInt(p[0])+' de '+MESES_L[parseInt(p[1])-1]+' '+p[2];}let d=new Date(c.fechaInicio+'T00:00:00');return d.getDate()+' de '+MESES_L[d.getMonth()]+' '+d.getFullYear();}catch(e){return '-';}}
function cuotaDelMes(c,clave){try{let inicio=new Date(c.fechaInicio+'T00:00:00');let [y,m]=clave.split('-').map(Number);let dif=(y-inicio.getFullYear())*12+(m-1-inicio.getMonth());if(dif<0||dif>=c.cuotas) return 0;return c.montoTotal/c.cuotas;}catch(e){return 0;}}
function numeroCuotaEnMes(c,y,m){try{let inicio=new Date(c.fechaInicio+'T00:00:00');return (y-inicio.getFullYear())*12+(m-inicio.getMonth())+1;}catch(e){return 1;}}
function totalMes(clave,tarjetaFiltro){return datos.consumos.filter(c=>c&&(!tarjetaFiltro||c.tarjeta===tarjetaFiltro)).reduce((a,c)=>a+cuotaDelMes(c,clave),0);}
function consumosQueSePaganEnMes(clave,tarjetaFiltro){return datos.consumos.filter(c=>c&&(!tarjetaFiltro||c.tarjeta===tarjetaFiltro)&&cuotaDelMes(c,clave)>0);}
function totalGastadoTotal(tarjetaFiltro){return datos.consumos.filter(c=>c&&(!tarjetaFiltro||c.tarjeta===tarjetaFiltro)).reduce((a,c)=>a+(parseFloat(c.montoTotal)||0),0);}
function ingresosDelMes(clave){return datos.ingresos.filter(i=>{if(!i.fecha) return true;return mesClaveDeFecha(i.fecha)===clave;});}
function totalIngresosMes(clave){if(!clave) clave=mesClave(new Date());return ingresosDelMes(clave).reduce((a,i)=>a+(parseFloat(i.monto)||0),0);}
function parseFechaCorta(s){if(!s) return null;let p=String(s).split('/');if(p.length!==3) return null;return new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));}
function cierreObjDeMes(y,m){let e=datos.cierres.find(c=>{let f=parseFechaCorta(c.cierre);return f&&f.getFullYear()===y&&f.getMonth()===m;});if(e) return e;if(y===2026&&m===10) return {cierre:datos.cierre,vencimiento:datos.vencimiento,aprox:false};if(y===2026&&m===11) return {cierre:datos.proxCierre,vencimiento:datos.proxVencimiento,aprox:false};return null;}
function cierreDeMes(y,m){let e=cierreObjDeMes(y,m);return e?e.cierre:'Sin cargar';}
function vencimientoDeMes(y,m){let e=cierreObjDeMes(y,m);return e?e.vencimiento:'Sin cargar';}
function textoCierreMes(y,m){let e=cierreObjDeMes(y,m);if(!e) return 'Cierra Sin cargar • Vence Sin cargar';return `Cierra ${e.cierre} ${e.aprox?'<span class="badge-aprox">APROX</span>':''} • Vence ${e.vencimiento} ${e.aprox?'<span class="badge-aprox">APROX</span>':''}`;}
function editarCierreMes(y,m){
  let e=cierreObjDeMes(y,m);let actualCierre=e?e.cierre:'';let actualVto=e?e.vencimiento:'';
  let nuevoCierre=prompt('Cierre de '+mesNombreLargo(y,m)+' (DD/MM/AAAA):',actualCierre);if(nuevoCierre===null) return;
  let nuevoVto=prompt('Vencimiento de '+mesNombreLargo(y,m)+' (DD/MM/AAAA):',actualVto);if(nuevoVto===null) return;
  nuevoCierre=nuevoCierre.trim();nuevoVto=nuevoVto.trim();if(!nuevoCierre||!nuevoVto) return alert('Poné cierre y vencimiento');
  if(e){e.cierre=nuevoCierre;e.vencimiento=nuevoVto;e.aprox=false;}
  else{datos.cierres.push({cierre:nuevoCierre,vencimiento:nuevoVto,aprox:false});datos.cierres.sort((a,b)=>{let fa=parseFechaCorta(a.cierre);let fb=parseFechaCorta(b.cierre);return (fa||new Date())-(fb||new Date());});}
  guardar();alert('✅ Guardado: '+mesNombreLargo(y,m)+' cierra '+nuevoCierre+' vence '+nuevoVto);render();
}
function gastosDelMes(y,m){return datos.gastos.filter(g=>{if(!g.fecha) return y===new Date().getFullYear()&&m===new Date().getMonth();try{let f=new Date(g.fecha+'T00:00:00');return f.getFullYear()===y&&f.getMonth()===m;}catch(e){return false;}});}
function totalGastosDelMes(y,m){return gastosDelMes(y,m).reduce((a,g)=>a+(parseFloat(g.monto)||0),0);}
function pedirCodigo(){let c=prompt('Ingresá el código:');if(c===null) return;if(c===datos.pin){desbloqueado=true;vista='ocultas';render();window.scrollTo(0,0);}else alert('❌ Código incorrecto');}
(function(){let cab=document.getElementById('cabecera');let toques=0;let ultimo=0;cab.addEventListener('click',function(){let ahora=Date.now();if(ahora-ultimo>1500) toques=0;ultimo=ahora;toques++;if(toques>=5){toques=0;pedirCodigo();}});if(window.location.hash==='#ocultas'){setTimeout(pedirCodigo,600);}window.addEventListener('hashchange',function(){if(window.location.hash==='#ocultas') pedirCodigo();});})();
function mostrar(v){vista=v;try{document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('activo'));let b=document.getElementById('b-'+v);if(b)b.classList.add('activo');}catch(e){}render();window.scrollTo(0,0);}
function toggleMes(k){mesAbierto=(mesAbierto===k?'':k);render();}
// V42 CONTROL: solo tarjeta, sin sumar gastos ni extras
function tarjetaControl(c,y,m){
  let num=numeroCuotaEnMes(c,y,m);let cuotaMonto=c.montoTotal/c.cuotas;
  let esUltima=(num===c.cuotas);let clase=esUltima?'ultima':(num>=c.cuotas-2?'destacada':'');let claseCuota=esUltima?'rojo':(num>=c.cuotas-2?'naranja':'');let idx=datos.consumos.indexOf(c);
  return `<div class="controlConsumo ${clase}"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><b style="font-size:18px">${c.descripcion}</b><br><span class="mutual">${c.tarjeta} • 📅 ${fechaCompraDe(c)}</span></div><span class="x" onclick="borrarConsumo(${idx})">✕</span></div><div><span class="cuotaGrande ${claseCuota}">${num}/${c.cuotas}</span>${esUltima?' <span class="badge-rojo">🔥 Última cuota</span>':''}</div><div style="margin-top:6px"><b>Monto a pagar de esta cuota: ${formato(cuotaMonto)}</b></div><div><b>Monto total de la compra: ${formato(c.montoTotal)}</b></div><div style="margin-top:10px;display:flex;gap:8px"><button class="btn-mini" style="background:#e2e8f0;flex:1" onclick="editarConsumo(${idx})">✏️ Editar consumo</button><button class="btn-mini" style="background:#fee2e2;flex:1" onclick="borrarConsumo(${idx})">🗑 Borrar</button></div></div>`;
}
function editarConsumo(i){
  let c=datos.consumos[i];if(!c) return;
  let desc=prompt('¿Qué compraste?',c.descripcion);if(desc===null) return;
  let montoS=prompt('Monto total de la compra:',c.montoTotal);if(montoS===null) return;
  let cuotasS=prompt('¿En cuántas cuotas?',c.cuotas);if(cuotasS===null) return;
  let fecha=prompt('Fecha de compra (AAAA-MM-DD):',c.fechaInicio);if(fecha===null) return;
  let monto=parseFloat(montoS);let cuotas=parseInt(cuotasS)||1;if(!desc.trim()||!monto) return alert('Faltan datos');
  c.descripcion=desc.trim();c.montoTotal=monto;c.cuotas=cuotas;c.fechaInicio=fecha;c.valorCuota=monto/cuotas;c.fechaCompraReal=fecha;
  guardar();alert('✅ Editado: '+c.descripcion+' - '+formato(monto)+' en '+cuotas+' cuotas');render();
}

function agregarCierre(){let c=document.getElementById('nuevo-cierre').value.trim();let v=document.getElementById('nuevo-venc').value.trim();if(!c||!v) return alert('Poné cierre y vencimiento');if(datos.cierres.some(x=>x.cierre===c)) return alert('Ese cierre ya está');datos.cierres.push({cierre:c,vencimiento:v,aprox:false});datos.proxCierre=c;datos.proxVencimiento=v;guardar();alert('✅ Agregado');render();}
function editarCierreLista(i){let c=datos.cierres[i];if(!c) return;let nc=prompt('Cierre (DD/MM/AAAA):',c.cierre);if(nc===null) return;let nv=prompt('Vencimiento (DD/MM/AAAA):',c.vencimiento);if(nv===null) return;nc=nc.trim();nv=nv.trim();if(!nc||!nv) return alert('Poné cierre y vencimiento');c.cierre=nc;c.vencimiento=nv;c.aprox=false;datos.cierres.sort((a,b)=>{let fa=parseFechaCorta(a.cierre);let fb=parseFechaCorta(b.cierre);return (fa||new Date())-(fb||new Date());});guardar();alert('✅ Corregido a Real: cierra '+nc+' vence '+nv);render();}
function borrarCierre(i){if(!confirm('¿Borrar ese cierre?'))return;datos.cierres.splice(i,1);guardar();render();}
function crearTarjeta(){let nombre=document.getElementById('nt-nombre').value.trim();if(!nombre) return alert('Poné nombre');if(datos.tarjetas.find(t=>t.nombre===nombre)) return alert('Ya existe');datos.tarjetas.push({nombre,banco:document.getElementById('nt-banco').value,ultimos:document.getElementById('nt-ultimos').value});guardar();mostrar('tarjetas');}
function crearTarjetaDesdeControl(){let nombre=document.getElementById('nt-nombre').value.trim();if(!nombre) return alert('Poné nombre');if(datos.tarjetas.find(t=>t.nombre===nombre)) return alert('Ya existe');datos.tarjetas.push({nombre,banco:document.getElementById('nt-banco').value,ultimos:document.getElementById('nt-ultimos').value});guardar();controlTarjeta=nombre;render();alert('✅ Tarjeta creada');}
function borrarTarjeta(n){if(!confirm('¿Borrar '+n+' y sus consumos?'))return;datos.tarjetas=datos.tarjetas.filter(t=>t.nombre!==n);datos.consumos=datos.consumos.filter(c=>c.tarjeta!==n);guardar();render();}
function cambiarPin(){let n=document.getElementById('nuevo-pin').value.trim();if(!n||n.length<4) return alert('Poné un código de al menos 4 números');datos.pin=n;guardar();alert('✅ Nuevo código: '+n);render();}
function agregarTarjetaOculta(){let nombre=document.getElementById('oc-nombre').value.trim();if(!nombre) return alert('Poné nombre');if(datos.tarjetasOcultas.find(t=>t.nombre===nombre)) return alert('Ya existe');datos.tarjetasOcultas.push({nombre,banco:document.getElementById('oc-banco').value,ultimos:document.getElementById('oc-ultimos').value});guardar();render();}
function borrarTarjetaOculta(i){if(!confirm('¿Borrar esta tarjeta?'))return;let n=datos.tarjetasOcultas[i].nombre;datos.tarjetasOcultas.splice(i,1);datos.consumosOcultos=datos.consumosOcultos.filter(c=>c.tarjeta!==n);guardar();render();}
function agregarConsumoOculto(ti){let t=datos.tarjetasOcultas[ti];let desc=document.getElementById('oc-desc-'+ti).value.trim();let monto=parseFloat(document.getElementById('oc-monto-'+ti).value);let cuotas=parseInt(document.getElementById('oc-cuotas-'+ti).value)||1;let fecha=document.getElementById('oc-fecha-'+ti).value||new Date().toISOString().slice(0,10);if(!desc||!monto) return alert('Completá descripción y monto');datos.consumosOcultos.push({descripcion:desc,montoTotal:monto,tarjeta:t.nombre,cuotas,fechaInicio:fecha,cuotaActual:1,valorCuota:monto/cuotas});guardar();alert('✅ Guardado');render();}
function borrarConsumoOculto(i){datos.consumosOcultos.splice(i,1);guardar();render();}
function agregarIngreso(){let desc=document.getElementById('ing-desc').value.trim();let monto=parseFloat(document.getElementById('ing-monto').value);if(!desc||!monto) return alert('Completá qué es y monto');let fecha=document.getElementById('ing-fecha').value;datos.ingresos.push({descripcion:desc,monto,fecha:fecha});guardar();alert('✅ Sueldo guardado');render();}
function borrarIngreso(i){datos.ingresos.splice(i,1);guardar();render();}
function agregarGasto(){let desc=document.getElementById('gas-desc').value.trim();let monto=parseFloat(document.getElementById('gas-monto').value);if(!desc||!monto) return alert('Completá gasto y monto');let fecha=document.getElementById('gas-fecha').value;let cat=document.getElementById('gas-cat').value;datos.gastos.push({descripcion:desc,monto,categoria:cat,fecha:fecha});guardar();alert('✅ Gasto guardado');render();}
function borrarGasto(i){datos.gastos.splice(i,1);guardar();render();}
function agregarConsumo(){let tarjeta=document.getElementById('c-tarjeta').value;let desc=document.getElementById('c-desc').value.trim();let monto=parseFloat(document.getElementById('c-monto').value);let cuotas=parseInt(document.getElementById('c-cuotas').value)||1;let fecha=document.getElementById('c-fecha').value||new Date().toISOString().slice(0,10);if(!tarjeta||!desc||!monto) return alert('Completá tarjeta, descripción y monto');datos.consumos.push({descripcion:desc,montoTotal:monto,tarjeta,cuotas,fechaInicio:fecha,cuotaActual:1,valorCuota:monto/cuotas,fechaCompraReal:fecha});guardar();alert('✅ Guardado!');mostrar('control');}
function agregarConsumoDesdeTarjetas(){let tarjeta=document.getElementById('t-nueva-tarjeta').value;let desc=document.getElementById('t-nueva-desc').value.trim();let monto=parseFloat(document.getElementById('t-nueva-monto').value);let cuotas=parseInt(document.getElementById('t-nueva-cuotas').value)||1;let fecha=document.getElementById('t-nueva-fecha').value||new Date().toISOString().slice(0,10);if(!tarjeta||!desc||!monto) return alert('Completá tarjeta, qué compraste y monto');datos.consumos.push({descripcion:desc,montoTotal:monto,tarjeta,cuotas,fechaInicio:fecha,cuotaActual:1,valorCuota:monto/cuotas,fechaCompraReal:fecha});guardar();alert('✅ Guardado en '+tarjeta);render();}
function agregarDesdeControlMes(k){
  let tarjeta=document.getElementById('ctrl-tarjeta-'+k).value;let desc=document.getElementById('ctrl-desc-'+k).value.trim();let monto=parseFloat(document.getElementById('ctrl-monto-'+k).value);let cuotas=parseInt(document.getElementById('ctrl-cuotas-'+k).value)||1;let fecha=document.getElementById('ctrl-fecha-'+k).value||k+'-01';
  if(!tarjeta||!desc||!monto) return alert('Completá tarjeta, qué compraste y monto');
  let antes=totalGastadoTotal(tarjeta);
  datos.consumos.push({descripcion:desc,montoTotal:monto,tarjeta,cuotas,fechaInicio:fecha,cuotaActual:1,valorCuota:monto/cuotas,fechaCompraReal:fecha});
  guardar();controlTarjeta=tarjeta;mesAbierto=k;
  alert('✅ Agregado a '+tarjeta+' en '+k+'\nAntes gastado: '+formato(antes)+'\nAhora gastado: '+formato(totalGastadoTotal(tarjeta)));
  render();
}
function borrarConsumo(i){if(!confirm('¿Borrar este consumo?'))return;datos.consumos.splice(i,1);guardar();render();}
function analizarResumen(){const texto=document.getElementById('resumen-texto').value.trim();const tarjeta=document.getElementById('resumen-tarjeta').value;const preview=document.getElementById('previewResumen');const debug=document.getElementById('debugResumen');if(!texto) return alert('Pegá primero el resumen');if(!tarjeta) return alert('Elegí la tarjeta');resumenDetectado=[];const lineas=texto.replace(/\r/g,'\n').split('\n').map(l=>l.trim()).filter(l=>l!=='');let ultimaFecha=null;let ultimaFechaTxt='';let log=[];let devoluciones=[];const ignorar=['copia fiel','subtotal','movimientos de','visa crédito terminada','fecha descripción','monto en dólares','otros conceptos','db iva'];for(let linea of lineas){let lb=linea.toLowerCase();if(ignorar.some(x=>lb.includes(x))) continue;let mDev=linea.match(/^(.+?)\s+(\d+)\s+menos\s+([\d\.]+,\d{2})\s*pesos\s*$/i);if(mDev){devoluciones.push({desc:mDev[1].trim().toLowerCase()});continue;}let m=linea.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})\s+(.+?)\s+(\d{1,2})\s+de\s+(\d{1,2})\s+(\d+)\s+([\d\.]+,\d{2})\s*pesos\s*$/i);if(m){let dia=parseInt(m[1]),mes=parseInt(m[2])-1,anio=parseInt(m[3]);if(anio<100) anio+=2000;let desc=m[4].trim();let cuotaActual=parseInt(m[5]);let cuotas=parseInt(m[6]);let monto=parseFloat(m[8].replace(/\./g,'').replace(',','.'));let fechaCompra=new Date(anio,mes,dia);ultimaFecha=fechaCompra;ultimaFechaTxt=dia+'/'+(mes+1)+'/'+anio;let inicioCorregido=new Date(2026,10-(cuotaActual-1),dia);resumenDetectado.push({descripcion:desc.slice(0,40),montoTotal:monto*cuotas,tarjeta,categoria:'Otros',cuotas,fechaInicio:inicioCorregido.toISOString().slice(0,10),cuotaActual,valorCuota:monto,fechaTexto:ultimaFechaTxt,fechaCompraReal:ultimaFechaTxt,corregidoV27:true});continue;}let m2=linea.match(/^(.+?)\s+(\d{1,2})\s+de\s+(\d{1,2})\s+(\d+)\s+([\d\.]+,\d{2})\s*pesos\s*$/i);if(m2 && ultimaFecha){let desc=m2[1].trim();let cuotaActual=parseInt(m2[2]);let cuotas=parseInt(m2[3]);let monto=parseFloat(m2[5].replace(/\./g,'').replace(',','.'));let inicioCorregido=new Date(2026,10-(cuotaActual-1),ultimaFecha.getDate());resumenDetectado.push({descripcion:desc.slice(0,40),montoTotal:monto*cuotas,tarjeta,categoria:'Otros',cuotas,fechaInicio:inicioCorregido.toISOString().slice(0,10),cuotaActual,valorCuota:monto,fechaTexto:ultimaFechaTxt,fechaCompraReal:ultimaFechaTxt,corregidoV27:true});continue;}let m3=linea.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})\s+(.+?)\s+(\d+)\s+([\d\.]+,\d{2})\s*pesos\s*$/i);if(m3){let dia=parseInt(m3[1]),mes=parseInt(m3[2])-1,anio=parseInt(m3[3]);if(anio<100) anio+=2000;let desc=m3[4].trim();let monto=parseFloat(m3[6].replace(/\./g,'').replace(',','.'));let fechaInicio=new Date(anio,mes,dia);ultimaFecha=fechaInicio;ultimaFechaTxt=dia+'/'+(mes+1)+'/'+anio;resumenDetectado.push({descripcion:desc.slice(0,40),montoTotal:monto,tarjeta,categoria:'Otros',cuotas:1,fechaInicio:fechaInicio.toISOString().slice(0,10),cuotaActual:1,valorCuota:monto,fechaTexto:ultimaFechaTxt,fechaCompraReal:ultimaFechaTxt,corregidoV27:true});continue;}log.push('NO ENTENDI: '+linea);}if(devoluciones.length){resumenDetectado=resumenDetectado.filter(r=>!devoluciones.some(d=>r.descripcion.toLowerCase().includes(d.desc)));}if(!resumenDetectado.length){if(preview) preview.innerHTML=`<p style="color:red">❌ No detecté nada.</p>`;if(debug) debug.innerHTML=`<div class="debug">${log.join('\n')}</div>`;return;}if(debug) debug.innerHTML=`<div class="debug">✅ Detecté ${resumenDetectado.length} consumos.</div>`;mostrarPreview();}
function quitarDeResumen(i){resumenDetectado.splice(i,1);if(!resumenDetectado.length){document.getElementById('previewResumen').innerHTML='';return;}mostrarPreview();}
function importarResumen(){if(!resumenDetectado.length) return alert('No hay nada');let nuevos=0,ya=0;resumenDetectado.forEach(r=>{let idx=datos.consumos.findIndex(c=>c.tarjeta===r.tarjeta && c.descripcion===r.descripcion && Math.abs(c.valorCuota-r.valorCuota)<1 && c.cuotas===r.cuotas);if(idx>=0){datos.consumos[idx]=r;ya++;} else {datos.consumos.push(r);nuevos++;}});datos.consumos=datos.consumos.filter(c=>!(c.descripcion.toLowerCase().includes('casa del audio')&&Math.abs(c.valorCuota-19166.70)<1));guardar();alert('✅ Nuevos: '+nuevos+' • Corregidos: '+ya);resumenDetectado=[];mostrar('control');}
mostrar('inicio');
}catch(e){document.getElementById('app').innerHTML=`<div class="card"><h2>⚠️ Error</h2><p class="mutual">${e.message}</p><button class="btn btn-red" onclick="window.recuperarForzado()">🔧 Recuperar mis datos</button></div>`;}
