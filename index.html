<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlyApp - Mis Finanzas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#f1f5f9;padding-bottom:115px;color:#1e293b}
header{background:#0f172a;color:white;padding:18px;text-align:center;position:sticky;top:0;z-index:10;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
header h1{font-size:20px} header p{font-size:13px;opacity:.8}
.container{max-width:520px;margin:0 auto;padding:14px}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
h2{font-size:17px;margin-bottom:10px} h3{font-size:15px;margin:14px 0 8px}
label{font-size:13px;font-weight:600;display:block;margin-top:10px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;margin-top:4px;font-size:15px;background:white}
textarea{min-height:180px}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;margin-top:10px}
.btn-green{background:#16a34a;color:white}.btn-blue{background:#2563eb;color:white}.btn-gray{background:#e2e8f0;color:#334155}.btn-orange{background:#ea580c;color:white}.btn-purple{background:#7c3aed;color:white}.btn-red{background:#dc2626;color:white}.btn-dark{background:#0f172a;color:white}
.fila{display:flex;gap:8px}.fila .btn{flex:1}
.total{font-size:28px;font-weight:800}.mutual{font-size:13px;color:#64748b}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9;gap:8px}
.x{color:red;cursor:pointer;font-weight:800;padding:6px 10px;font-size:18px;flex-shrink:0}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;overflow-x:auto;border-top:2px solid #2563eb;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:999;box-shadow:0 -2px 10px rgba(0,0,0,.1);scrollbar-width:none}
.bottom::-webkit-scrollbar{display:none}
.bottom button{flex:1;min-width:62px;background:none;border:none;padding:8px 2px;font-size:12px;cursor:pointer;color:#64748b;line-height:1.2;white-space:nowrap}
.bottom button.activo{color:#2563eb;font-weight:800;background:#eff6ff;border-radius:10px}
.mesBox{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:8px}
.alerta{background:#fef3c7;border:1px solid #fbbf24;padding:12px;border-radius:12px;font-size:14px;line-height:1.5}
.alerta-verde{background:#dcfce7;border:1px solid #16a34a;padding:12px;border-radius:12px;font-size:14px;line-height:1.5}
.alerta-azul{background:#eff6ff;border:1px solid #2563eb;padding:12px;border-radius:12px;font-size:14px;line-height:1.5}
.badge{background:#16a34a;color:white;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.badge-rojo{background:#dc2626;color:white;padding:3px 9px;border-radius:10px;font-size:12px;font-weight:800}
.badge-naranja{background:#ea580c;color:white;padding:3px 9px;border-radius:10px;font-size:12px;font-weight:800}
.badge-gris{background:#64748b;color:white;padding:3px 9px;border-radius:10px;font-size:12px;font-weight:700}
.cuotaRow{display:flex;justify-content:space-between;gap:8px;padding:9px 8px;border-bottom:1px solid #f1f5f9;font-size:13px;align-items:center}
.cuotaRow:last-child{border:none}
.cuotaRow.destacada{background:#fef3c7;border-left:4px solid #ea580c;border-radius:8px}
.cuotaRow.ultima{background:#fee2e2;border-left:4px solid #dc2626;border-radius:8px}
.saldoBox{display:flex;gap:8px;margin-top:10px}
.saldoBox div{flex:1;background:#f8fafc;border-radius:12px;padding:10px;text-align:center}
.debug{background:#0f172a;color:#a7f3d0;padding:10px;border-radius:10px;font-size:12px;white-space:pre-wrap;word-break:break-word;margin-top:10px}
.resumenCuotas{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.resumenCuotas span{padding:6px 10px;border-radius:10px;font-size:12px;font-weight:700}
</style>
</head>
<body>
<header id="cabecera"><h1>💳 SlyApp</h1><p>Ingresos • Gastos • Tarjetas • Cuotas</p></header>
<div class="container" id="app"><div class="card"><p id="txt-carga">Cargando... Si queda así, tocá Recuperar.</p><button class="btn btn-red" onclick="window.recuperarForzado && window.recuperarForzado()">🔧 Recuperar mis datos</button></div></div>
<nav class="bottom">
<button onclick="mostrar('inicio')" id="b-inicio">🏠<br>Inicio</button>
<button onclick="mostrar('ingresos')" id="b-ingresos">💰<br>Ingresos</button>
<button onclick="mostrar('gastos')" id="b-gastos">🧾<br>Gastos</button>
<button onclick="mostrar('tarjetas')" id="b-tarjetas">💳<br>Tarjetas</button>
<button onclick="mostrar('agregar')" id="b-agregar">➕<br>Agregar</button>
<button onclick="mostrar('resumen')" id="b-resumen">📄<br>Resumen</button>
<button onclick="mostrar('calendario')" id="b-calendario">📅<br>Calendario</button>
</nav>
<script>
// V38 - ARRANQUE A PRUEBA DE CACHÉ: si algo falla, igual muestra la app
window.recuperarForzado=function(){try{let keys=[];for(let i=0;i<localStorage.length;i++){keys.push(localStorage.key(i));}let mejor=null;keys.forEach(k=>{try{let d=JSON.parse(localStorage.getItem(k)||'null');if(d&&d.consumos&&(!mejor||d.consumos.length>mejor.consumos.length)) mejor=d;}catch(e){}});if(mejor){localStorage.setItem('slyapp_v38',JSON.stringify(mejor));alert('✅ Encontré '+mejor.consumos.length+' consumos. Recargá con ?v=38');location.reload();}else{alert('No encontré datos viejos en esta tablet. ¿Entraste en otra tablet / otro navegador?');}}catch(e){alert('Error: '+e.message);}};
try{
function baseVacia(){return {tarjetas:[],consumos:[],ingresos:[],gastos:[],cierre:'19/11/2026',vencimiento:'01/12/2026',proxCierre:'23/12/2026',proxVencimiento:'04/01/2027',cierres:[{cierre:'19/11/2026',vencimiento:'01/12/2026'},{cierre:'23/12/2026',vencimiento:'04/01/2027'}],tarjetasOcultas:[],consumosOcultos:[],pin:'1234'};}
function cargarTodo(){
  let base=baseVacia();
  try{
    ['slyapp_v37','slyapp_v36','slyapp_v35','slyapp_v34','slyapp_v33','slyapp_v32','slyapp_v31','slyapp_v30','slyapp_v29'].forEach(k=>{
      try{let d=JSON.parse(localStorage.getItem(k)||'null');if(!d||typeof d!=='object') return;
        if(Array.isArray(d.tarjetas)&&d.tarjetas.length>base.tarjetas.length) base.tarjetas=d.tarjetas;
        if(Array.isArray(d.consumos)&&d.consumos.length>base.consumos.length) base.consumos=d.consumos;
        if(Array.isArray(d.ingresos)&&d.ingresos.length>base.ingresos.length) base.ingresos=d.ingresos;
        if(Array.isArray(d.gastos)&&d.gastos.length>base.gastos.length) base.gastos=d.gastos;
        if(d.cierre) base.cierre=d.cierre; if(d.vencimiento) base.vencimiento=d.vencimiento;
        if(d.proxCierre) base.proxCierre=d.proxCierre; if(d.proxVencimiento) base.proxVencimiento=d.proxVencimiento;
        if(Array.isArray(d.cierres)&&d.cierres.length) base.cierres=d.cierres;
        if(Array.isArray(d.tarjetasOcultas)) base.tarjetasOcultas=d.tarjetasOcultas;
        if(Array.isArray(d.consumosOcultos)) base.consumosOcultos=d.consumosOcultos;
        if(d.pin) base.pin=d.pin;
      }catch(e){}
    });
  }catch(e){base=baseVacia();}
  if(!Array.isArray(base.tarjetas)) base.tarjetas=[];
  if(!Array.isArray(base.consumos)) base.consumos=[];
  if(!Array.isArray(base.ingresos)) base.ingresos=[];
  if(!Array.isArray(base.gastos)) base.gastos=[];
  if(!Array.isArray(base.cierres)||!base.cierres.length) base.cierres=[{cierre:'19/11/2026',vencimiento:'01/12/2026'},{cierre:'23/12/2026',vencimiento:'04/01/2027'}];
  if(!Array.isArray(base.tarjetasOcultas)) base.tarjetasOcultas=[];
  if(!Array.isArray(base.consumosOcultos)) base.consumosOcultos=[];
  if(!base.pin) base.pin='1234';
  try{
    base.gastos.forEach(g=>{if(!g.categoria) g.categoria='Gastos generales';});
    base.consumos.forEach(c=>{if(c&&c.fechaTexto&&c.cuotaActual&&c.cuotaActual>1&&!c.corregidoV27){c.fechaCompraReal=c.fechaTexto;let dia=parseInt(String(c.fechaTexto).split('/')[0])||1;let inicio=new Date(2026,10-(c.cuotaActual-1),dia);c.fechaInicio=inicio.toISOString().slice(0,10);c.corregidoV27=true;}});
    base.ingresos.forEach(i=>{if(!i.fecha) i.fecha='';});
  }catch(e){}
  return base;
}
let datos=cargarTodo();
let vista='inicio';let resumenDetectado=[];let desbloqueado=false;let tarjetaSeleccionada='';let mesSeleccionado='';
function mesesHastaJunio2027(){let hoy=new Date();let arr=[];let d=new Date(hoy.getFullYear(),hoy.getMonth(),1);let fin=new Date(2027,5,1);while(d<=fin){arr.push(mesClave(d));d=new Date(d.getFullYear(),d.getMonth()+1,1);}return arr;}
function guardar(){try{localStorage.setItem('slyapp_v38',JSON.stringify(datos));}catch(e){}}
function recuperarTodo(){try{let b=cargarTodo();datos=b;guardar();alert('✅ Recuperado: '+datos.consumos.length+' consumos, '+datos.ingresos.length+' sueldos, '+datos.gastos.length+' gastos, '+datos.tarjetas.length+' tarjetas.');vista='inicio';render();}catch(e){datos=baseVacia();render();}}
function formato(n){let v=Number(n);if(isNaN(v)) v=0;return '$ '+v.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});}
const MESES_L=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MESES_N=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function mesNombre(y,m){return MESES_N[m]+' '+y;}
function mesNombreLargo(y,m){return MESES_L[m]+' '+y;}
function mesClave(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function mesClaveDeFecha(f){if(!f) return null;try{return mesClave(new Date(f+'T00:00:00'));}catch(e){return null;}}
function fechaCompraDe(c){try{if(c.fechaCompraReal){let p=String(c.fechaCompraReal).split('/');if(p.length===3) return parseInt(p[0])+' de '+MESES_L[parseInt(p[1])-1]+' '+p[2];}let d=new Date(c.fechaInicio+'T00:00:00');return d.getDate()+' de '+MESES_L[d.getMonth()]+' '+d.getFullYear();}catch(e){return '-';}}
function cuotaDelMes(c,clave){try{let inicio=new Date(c.fechaInicio+'T00:00:00');let [y,m]=clave.split('-').map(Number);let dif=(y-inicio.getFullYear())*12+(m-1-inicio.getMonth());if(dif<0||dif>=c.cuotas) return 0;return c.montoTotal/c.cuotas;}catch(e){return 0;}}
function numeroCuotaEnMes(c,y,m){try{let inicio=new Date(c.fechaInicio+'T00:00:00');return (y-inicio.getFullYear())*12+(m-inicio.getMonth())+1;}catch(e){return 1;}}
function quedanEnMes(c,y,m){return Math.max(0,c.cuotas-numeroCuotaEnMes(c,y,m)+1);}
function totalMes(clave,tarjetaFiltro){return datos.consumos.filter(c=>c&&(!tarjetaFiltro||c.tarjeta===tarjetaFiltro)).reduce((a,c)=>a+cuotaDelMes(c,clave),0);}
function consumosQueSePaganEnMes(clave,tarjetaFiltro){return datos.consumos.filter(c=>c&&(!tarjetaFiltro||c.tarjeta===tarjetaFiltro)&&cuotaDelMes(c,clave)>0);}
function consumosPendientesEnMes(clave,tarjetaFiltro){return consumosQueSePaganEnMes(clave,tarjetaFiltro);}
function totalPendienteMes(clave,tarjetaFiltro){return consumosPendientesEnMes(clave,tarjetaFiltro).reduce((a,c)=>a+cuotaDelMes(c,clave),0);}
function totalGastadoTotal(tarjetaFiltro){return datos.consumos.filter(c=>c&&(!tarjetaFiltro||c.tarjeta===tarjetaFiltro)).reduce((a,c)=>a+(parseFloat(c.montoTotal)||0),0);}
function ingresosDelMes(clave){return datos.ingresos.filter(i=>{if(!i.fecha) return true;return mesClaveDeFecha(i.fecha)===clave;});}
function totalIngresosMes(clave){if(!clave) clave=mesClave(new Date());return ingresosDelMes(clave).reduce((a,i)=>a+(parseFloat(i.monto)||0),0);}
function totalGastosMes(){return datos.gastos.reduce((a,g)=>a+(parseFloat(g.monto)||0),0);}
function totalGastosPorCat(cat){return datos.gastos.filter(g=>(g.categoria||'Gastos generales')===cat).reduce((a,g)=>a+(parseFloat(g.monto)||0),0);}
function parseFechaCorta(s){if(!s) return null;let p=String(s).split('/');if(p.length!==3) return null;return new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));}
function cierreDeMes(y,m){let e=datos.cierres.find(c=>{let f=parseFechaCorta(c.cierre);return f&&f.getFullYear()===y&&f.getMonth()===m;});if(e) return e.cierre;if(y===2026&&m===10) return datos.cierre;if(y===2026&&m===11) return datos.proxCierre;return 'Sin cargar';}
function vencimientoDeMes(y,m){let e=datos.cierres.find(c=>{let f=parseFechaCorta(c.cierre);return f&&f.getFullYear()===y&&f.getMonth()===m;});if(e) return e.vencimiento;if(y===2026&&m===10) return datos.vencimiento;if(y===2026&&m===11) return datos.proxVencimiento;return 'Sin cargar';}
function gastosDelMes(y,m){return datos.gastos.filter(g=>{if(!g.fecha) return y===new Date().getFullYear()&&m===new Date().getMonth();try{let f=new Date(g.fecha+'T00:00:00');return f.getFullYear()===y&&f.getMonth()===m;}catch(e){return false;}});}
function totalGastosDelMes(y,m){return gastosDelMes(y,m).reduce((a,g)=>a+(parseFloat(g.monto)||0),0);}
function serviciosAgrupados(){let map={};datos.gastos.filter(g=>g.categoria==='Servicios').forEach(g=>{if(!map[g.descripcion]) map[g.descripcion]=[];map[g.descripcion].push(g);});return map;}
function pedirCodigo(){let c=prompt('Ingresá el código:');if(c===null) return;if(c===datos.pin){desbloqueado=true;vista='ocultas';render();window.scrollTo(0,0);}else alert('❌ Código incorrecto');}
(function(){let cab=document.getElementById('cabecera');let toques=0;let ultimo=0;cab.addEventListener('click',function(){let ahora=Date.now();if(ahora-ultimo>1500) toques=0;ultimo=ahora;toques++;if(toques>=5){toques=0;pedirCodigo();}});if(window.location.hash==='#ocultas'){setTimeout(pedirCodigo,600);}window.addEventListener('hashchange',function(){if(window.location.hash==='#ocultas') pedirCodigo();});})();
function mostrar(v){vista=v;try{document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('activo'));let b=document.getElementById('b-'+v);if(b)b.classList.add('activo');}catch(e){}render();window.scrollTo(0,0);}
function badgeCuotas(c,y,m){let quedan=quedanEnMes(c,y,m);if(quedan===1) return `<span class="badge-rojo">🔥 FALTA 1 CUOTA - Última</span>`;if(quedan===2) return `<span class="badge-naranja">⏳ FALTAN 2 CUOTAS</span>`;return `<span class="badge-gris">⏳ FALTAN ${quedan} CUOTAS</span>`;}
function lineaConsumoMes(c,y,m){let num=numeroCuotaEnMes(c,y,m);let quedan=quedanEnMes(c,y,m);let faltaMonto=quedan*(c.montoTotal/c.cuotas);return `<div style="line-height:1.55"><b style="font-size:15px">${c.descripcion}</b><br><span class="mutual">${c.tarjeta}</span><br><span>📅 <b>Fecha de compra: ${fechaCompraDe(c)}</b></span><br><span>💰 <b>Monto total: ${formato(c.montoTotal)}</b></span><br><span>🧾 Cuota ${num} de ${c.cuotas} este mes</span><br>${badgeCuotas(c,y,m)} <span style="font-size:12px;color:#64748b">• Falta pagar ${formato(faltaMonto)}</span></div>`;}
function mostrarPreview(){const preview=document.getElementById('previewResumen');if(!preview) return;preview.innerHTML=`<div style="margin-top:14px;background:#ecfdf5;padding:14px;border-radius:12px;"><div class="alerta-verde"><b>Este resumen TARJETA: cerrado ${datos.cierre} • VENCE ${datos.vencimiento}</b><br>Total a pagar el ${datos.vencimiento}: <b>${formato(resumenDetectado.reduce((a,r)=>a+r.valorCuota,0))}</b></div><div class="alerta-azul" style="margin-top:8px"><b>Próximo: cierra ${datos.proxCierre} • Vence ${datos.proxVencimiento}</b></div><b>✅ Detecté ${resumenDetectado.length} consumos:</b>${resumenDetectado.map((r,i)=>{let restantes=r.cuotas-r.cuotaActual+1;return `<div style="padding:10px 0;border-bottom:1px solid #ddd;font-size:14px;"><div style="display:flex;justify-content:space-between"><span><b>${r.descripcion}</b><br><small>📅 Comprado: <b>${fechaCompraDe(r)}</b> • Cuota ${r.cuotaActual} de ${r.cuotas}</small></span><span style="text-align:right"><b>${formato(r.valorCuota)}</b><br><span style="color:red;cursor:pointer;font-size:13px;" onclick="quitarDeResumen(${i})">Quitar</span></span></div><div style="font-size:12px;margin-top:4px"><span class="badge ${restantes===1?'badge-rojo':''}">${restantes===1?'🔥 Última cuota':'Quedan '+restantes+' cuotas'}</span> <span style="color:#666">Total ${formato(r.montoTotal)}</span></div></div>`}).join('')}<button class="btn btn-green" onclick="importarResumen()">✅ Importar todo</button></div>`;}
function render(){
  let el=document.getElementById('app');if(!el) return;
  try{
  let hoy=new Date();let clave=mesClave(hoy);let claveProx=mesClave(new Date(hoy.getFullYear(),hoy.getMonth()+1,1));let mesesTodos=mesesHastaJunio2027();
  if(vista==='ocultas'){
    if(!desbloqueado){el.innerHTML=`<div class="card"><h2>🔒</h2><button class="btn btn-gray" onclick="mostrar('inicio')">Volver</button></div>`;return;}
    el.innerHTML=`<div class="card"><h2>🔒</h2><p class="mutual">Estas no aparecen en Inicio ni en Calendario. Solo acá.</p><div class="alerta">Código actual: <b>${datos.pin}</b></div><label>Cambiar código</label><input id="nuevo-pin" placeholder="Ej: 2611" maxlength="6"><button class="btn btn-dark" onclick="cambiarPin()">🔒 Cambiar código</button></div><div class="card"><h2>➕ Agregar otra tarjeta</h2><label>Nombre</label><input id="oc-nombre" placeholder="Ej: Visa Banco X"><label>Banco</label><input id="oc-banco" placeholder="Banco"><label>Últimos 4</label><input id="oc-ultimos" placeholder="1234"><button class="btn btn-green" onclick="agregarTarjetaOculta()">Guardar</button></div>${datos.tarjetasOcultas.map((t,ti)=>{let cons=datos.consumosOcultos.filter(c=>c.tarjeta===t.nombre);let tot=cons.reduce((a,c)=>a+(c.montoTotal/c.cuotas),0);return `<div class="card"><div style="display:flex;justify-content:space-between"><div><b>${t.nombre}</b><br><span class="mutual">${t.banco||''} •••• ${t.ultimos||''} • ${cons.length} consumos • Este mes ${formato(tot)}</span></div><span class="x" onclick="borrarTarjetaOculta(${ti})">✕</span></div><label>Consumo en ${t.nombre}</label><input id="oc-desc-${ti}" placeholder="Ej: Farmacity"><label>Monto total</label><input id="oc-monto-${ti}" type="number" placeholder="60000"><label>Cuotas</label><input id="oc-cuotas-${ti}" type="number" value="1"><label>Fecha de compra</label><input id="oc-fecha-${ti}" type="date"><button class="btn btn-blue" onclick="agregarConsumoOculto(${ti})">➕ Agregar consumo</button>${cons.map(c=>{let idx=datos.consumosOcultos.indexOf(c);return `<div class="item"><div><b>${c.descripcion}</b><br><span class="mutual">📅 ${c.fechaInicio} • ${c.cuotas} cuotas • ${formato(c.montoTotal/c.cuotas)} por mes</span></div><div><b>${formato(c.montoTotal)}</b> <span class="x" onclick="borrarConsumoOculto(${idx})">✕</span></div></div>`}).join('')||'<p class="mutual">Sin consumos.</p>'}</div>`}).join('')||'<div class="card"><p class="mutual">Sin tarjetas acá todavía.</p></div>'}<div class="card"><button class="btn btn-gray" onclick="desbloqueado=false;mostrar('inicio')">🔒 Cerrar y volver a Inicio</button></div>`;
    return;
  }

    el.innerHTML=`<div class="card"><h2>${nombre}</h2><p class="mutual">${cons.length} consumos • Se paga el ${datos.vencimiento}: ${formato(totalMes(clave,nombre))} • Total gastado: ${formato(totalGastadoTotal(nombre))}</p><p class="mutual">Solo cuotas pendientes.</p><button class="btn btn-gray" onclick="mostrar('tarjetas')">← Volver a Tarjetas</button></div>${cons.map(c=>{let globalIdx=datos.consumos.indexOf(c);let inicio=new Date(c.fechaInicio+'T00:00:00');let cuotaHoy=numeroCuotaEnMes(c,hoy.getFullYear(),hoy.getMonth());let cuotasPendientes=Array.from({length:c.cuotas},(_,i)=>i+1).filter(num=>{let d=new Date(inicio.getFullYear(),inicio.getMonth()+num-1,1);return mesClave(d)>=clave;});if(!cuotasPendientes.length) return `<div class="card"><div style="display:flex;justify-content:space-between"><div><b>${c.descripcion}</b><br><span class="mutual">📅 ${fechaCompraDe(c)} • Total ${formato(c.montoTotal)} • ✅ Ya pagada toda</span></div><span class="x" onclick="borrarConsumo(${globalIdx})">✕</span></div></div>`;return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><div>${lineaConsumoMes(c,hoy.getFullYear(),hoy.getMonth())}</div><span class="x" onclick="borrarConsumo(${globalIdx})">✕</span></div><div style="margin-top:12px"><b>Cuotas pendientes:</b>${cuotasPendientes.map(num=>{let d=new Date(inicio.getFullYear(),inicio.getMonth()+num-1,1);let estado=num===cuotaHoy?'🟡 Este mes - vence '+datos.vencimiento:'⏳ Pendiente - vence '+vencimientoDeMes(d.getFullYear(),d.getMonth());return `<div class="cuotaRow"><span><b>${c.descripcion}</b><br><span class="mutual">${mesNombre(d.getFullYear(),d.getMonth())} • Cuota ${num} de ${c.cuotas} • ${estado}</span></span><b>${formato(c.montoTotal/c.cuotas)}</b></div>`}).join('')}</div></div>`;}).join('')||'<div class="card">Sin consumos.</div>'}`;
  }
  }catch(err){el.innerHTML=`<div class="card"><h2>⚠️ Hubo un error</h2><p class="mutual">${err.message}</p><button class="btn btn-red" onclick="recuperarTodo()">🔧 Recuperar mis datos</button></div>`;}
}

function analizarResumen(){const texto=document.getElementById('resumen-texto').value.trim();const tarjeta=document.getElementById('resumen-tarjeta').value;const preview=document.getElementById('previewResumen');const debug=document.getElementById('debugResumen');if(!texto) return alert('Pegá primero el resumen');if(!tarjeta) return alert('Elegí la tarjeta');resumenDetectado=[];const lineas=texto.replace(/\r/g,'\n').split('\n').map(l=>l.trim()).filter(l=>l!=='');let ultimaFecha=null;let ultimaFechaTxt='';let log=[];let devoluciones=[];const ignorar=['copia fiel','subtotal','movimientos de','visa crédito terminada','fecha descripción','monto en dólares','otros conceptos','db iva'];for(let linea of lineas){let lb=linea.toLowerCase();if(ignorar.some(x=>lb.includes(x))) continue;let mDev=linea.match(/^(.+?)\s+(\d+)\s+menos\s+([\d\.]+,\d{2})\s*pesos\s*$/i);if(mDev){devoluciones.push({desc:mDev[1].trim().toLowerCase()});continue;}let m=linea.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})\s+(.+?)\s+(\d{1,2})\s+de\s+(\d{1,2})\s+(\d+)\s+([\d\.]+,\d{2})\s*pesos\s*$/i);if(m){let dia=parseInt(m[1]),mes=parseInt(m[2])-1,anio=parseInt(m[3]);if(anio<100) anio+=2000;let desc=m[4].trim();let cuotaActual=parseInt(m[5]);let cuotas=parseInt(m[6]);let monto=parseFloat(m[8].replace(/\./g,'').replace(',','.'));let fechaCompra=new Date(anio,mes,dia);ultimaFecha=fechaCompra;ultimaFechaTxt=dia+'/'+(mes+1)+'/'+anio;let inicioCorregido=new Date(2026,10-(cuotaActual-1),dia);resumenDetectado.push({descripcion:desc.slice(0,40),montoTotal:monto*cuotas,tarjeta,categoria:'Otros',cuotas,fechaInicio:inicioCorregido.toISOString().slice(0,10),cuotaActual,valorCuota:monto,fechaTexto:ultimaFechaTxt,fechaCompraReal:ultimaFechaTxt,corregidoV27:true});continue;}let m2=linea.match(/^(.+?)\s+(\d{1,2})\s+de\s+(\d{1,2})\s+(\d+)\s+([\d\.]+,\d{2})\s*pesos\s*$/i);if(m2 && ultimaFecha){let desc=m2[1].trim();let cuotaActual=parseInt(m2[2]);let cuotas=parseInt(m2[3]);let monto=parseFloat(m2[5].replace(/\./g,'').replace(',','.'));let inicioCorregido=new Date(2026,10-(cuotaActual-1),ultimaFecha.getDate());resumenDetectado.push({descripcion:desc.slice(0,40),montoTotal:monto*cuotas,tarjeta,categoria:'Otros',cuotas,fechaInicio:inicioCorregido.toISOString().slice(0,10),cuotaActual,valorCuota:monto,fechaTexto:ultimaFechaTxt,fechaCompraReal:ultimaFechaTxt,corregidoV27:true});continue;}let m3=linea.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})\s+(.+?)\s+(\d+)\s+([\d\.]+,\d{2})\s*pesos\s*$/i);if(m3){let dia=parseInt(m3[1]),mes=parseInt(m3[2])-1,anio=parseInt(m3[3]);if(anio<100) anio+=2000;let desc=m3[4].trim();let monto=parseFloat(m3[6].replace(/\./g,'').replace(',','.'));let fechaInicio=new Date(anio,mes,dia);ultimaFecha=fechaInicio;ultimaFechaTxt=dia+'/'+(mes+1)+'/'+anio;resumenDetectado.push({descripcion:desc.slice(0,40),montoTotal:monto,tarjeta,categoria:'Otros',cuotas:1,fechaInicio:fechaInicio.toISOString().slice(0,10),cuotaActual:1,valorCuota:monto,fechaTexto:ultimaFechaTxt,fechaCompraReal:ultimaFechaTxt,corregidoV27:true});continue;}log.push('NO ENTENDI: '+linea);}if(devoluciones.length){resumenDetectado=resumenDetectado.filter(r=>!devoluciones.some(d=>r.descripcion.toLowerCase().includes(d.desc)));}if(!resumenDetectado.length){if(preview) preview.innerHTML=`<p style="color:red">❌ No detecté nada.</p>`;if(debug) debug.innerHTML=`<div class="debug">${log.join('\n')}</div>`;return;}if(debug) debug.innerHTML=`<div class="debug">✅ Detecté ${resumenDetectado.length} consumos.</div>`;mostrarPreview();}
function quitarDeResumen(i){resumenDetectado.splice(i,1);if(!resumenDetectado.length){document.getElementById('previewResumen').innerHTML='';return;}mostrarPreview();}
function importarResumen(){if(!resumenDetectado.length) return alert('No hay nada');let nuevos=0,ya=0;resumenDetectado.forEach(r=>{let idx=datos.consumos.findIndex(c=>c.tarjeta===r.tarjeta && c.descripcion===r.descripcion && Math.abs(c.valorCuota-r.valorCuota)<1 && c.cuotas===r.cuotas);if(idx>=0){datos.consumos[idx]=r;ya++;} else {datos.consumos.push(r);nuevos++;}});datos.consumos=datos.consumos.filter(c=>!(c.descripcion.toLowerCase().includes('casa del audio')&&Math.abs(c.valorCuota-19166.70)<1));guardar();alert('✅ Nuevos: '+nuevos+' • Corregidos: '+ya);resumenDetectado=[];mostrar('inicio');}
mostrar('inicio');
}catch(e){document.getElementById('app').innerHTML=`<div class="card"><h2>⚠️ Error al arrancar</h2><p class="mutual">${e.message}</p><p class="mutual">Tocá Recuperar o entrá en incógnito con ?v=38</p><button class="btn btn-red" onclick="window.recuperarForzado()">🔧 Recuperar mis datos</button></div>`;}
