<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Gastos y Cuotas</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 0 auto; padding: 16px; background: #f4f4f5; }
    h1 { text-align: center; }
    .card { background: white; padding: 16px; border-radius: 12px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    input, select, button { width: 100%; padding: 10px; margin: 6px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
    button { background: #111; color: white; font-weight: bold; cursor: pointer; border: none; }
    .item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
    .total { font-size: 20px; font-weight: bold; text-align: center; }
    .cuota { font-size: 13px; color: #666; }
    .delete { color: red; cursor: pointer; background: none; width: auto; padding: 0; }
  </style>
</head>
<body>
  <h1>💳 Mis Gastos</h1>

  <div class="card">
    <h3>Agregar gasto / cuota</h3>
    <input id="descripcion" placeholder="Ej: Supermercado, Zapatillas...">
    <input id="monto" type="number" placeholder="Monto total Ej: 120000">
    <select id="tarjeta">
      <option value="Visa">Visa</option>
      <option value="Mastercard">Mastercard</option>
      <option value="Efectivo">Efectivo / Débito</option>
    </select>
    <input id="cuotas" type="number" placeholder="Cuotas Ej: 1, 3, 6, 12" value="1" min="1" max="24">
    <input id="fecha" type="date">
    <button onclick="agregarGasto()">Agregar</button>
  </div>

  <div class="card">
    <div class="total" id="totalMes">Total este mes: $0</div>
    <div style="text-align:center; font-size:13px; color:#666;" id="totalDeuda">Deuda total en cuotas: $0</div>
  </div>

  <div class="card">
    <h3>Listado</h3>
    <div id="lista"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
